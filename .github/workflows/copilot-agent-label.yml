name: Copilot Coding Agent Label Monitor

on:
  issues:
    types:
      - opened
      - labeled

jobs:
  call-coding-agent:
    if: contains(github.event.issue.labels.*.name, 'copilot-coding-agent')
    runs-on: ubuntu-latest
    steps:
      - name: Announce Delegation
        run: echo "Delegating issue" #${{ github.event.issue.number }}
